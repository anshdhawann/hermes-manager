name: hermes-manager
version: 0.4.1
description: >-
  Let Hermes manage its own plugins, skills and MCP servers without a restart. Tools: plugin_manager
  (list, create, enable, disable, delete, rename, reload, log, undo), skill_manager (list, enable, disable) and
  mcp_manager (list, add, enable, disable, reconnect, login). Turning on any plugin, even one Hermes made,
  shows an approval card; so do changes to the user's things, every MCP add and installs into ~/.hermes.
  Every change is logged (/manager-log) and can be undone (/manager-undo). Also `hermes reload-plugins`
  and /reload-plugins.
author: anshdhawann
license: Apache-2.0
homepage: https://github.com/anshdhawann/hermes-manager
manifest_version: 2
api_version: 1
requires_hermes: ">=0.23.0"
tags: [plugins, skills, mcp, reload, dev]
provides_tools:
  - plugin_manager
  - skill_manager
  - mcp_manager
provides_hooks:
  - pre_tool_call
  - post_tool_call
requires_env: []
config_schema:
  trust_own_items:
    type: bool
    default: false
    required: false
    description: >-
      Let Hermes turn on, and edit while on, plugins it made itself with no approval card. Off by default, so
      no plugin code runs that you have not approved on a card. Changing this through Hermes' file or terminal
      tools also asks.
